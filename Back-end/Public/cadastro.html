<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cadastro </title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    
    <div id="cartão">
        <div id="titulo"> 
            <h1 > Fazer Cadastro </h1>
        </div>


        <form action="/cadastro" method="post">


            <label for="nome"> nome </label>
            <input type="text" id="nome" name="nome_usuario" autocomplete="name" required>
            

            <label for="email"> email </label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            

            <label for="senha"> senha </label>
            <input type="password" id="senha" name="senha" minlength="12" autocomplete="new-password"
            required>
            

            <label for="confirmar"> Confirmar senha </label>
            <input type="password" id="confirmar" minlength="12" autocomplete="new-password" required>
            
            
            <button type="submit"> Cadastrar </button>
        
        </form>


        <p id="mensagem"></p>
    </div>
    <script src="/script.js"></script>
</body>

</html>
